    <section style="line-height: 2em;">首先，先保证你已经学完第 ① 轮的计算机组成原理的课程，然后再来学习本课程</section><section style="line-height: 2em;"><br/></section><p style="line-height: 2em;">本课程包括计组的图文总结和专项训练，本课程的章节之间是有联系的，比如在第一章会涉及到第五章甚至第六章的内容，如果你没有学完第 ① 轮的计组，那么学习本课程会有点吃力的</p><p style="line-height: 2em;"><br/></p><p style="line-height: 2em;">本课程可以在你学习完第 ① 轮的计组，然后和第 ① 轮的数据结构并行学习，也就是在学习第 ① 轮的数据结构的同时，也学习本课程，这个就是交叉复习，主要的目的是为了抗遗忘，因为一门课，如果很长时间不复习的话，容易忘记</p>
